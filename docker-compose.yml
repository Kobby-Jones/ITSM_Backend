version: '3.9'

services:
  # ============================================================
  # PostgreSQL Database
  # ============================================================
  postgres:
    image: postgres:16-alpine
    container_name: itsm_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-itsm_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-itsm_password}
      POSTGRES_DB: ${DB_NAME:-itsm_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-itsm_user} -d ${DB_NAME:-itsm_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - itsm_network

  # ============================================================
  # Redis Cache & Queue
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: itsm_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_password} --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_password}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - itsm_network

  # ============================================================
  # ITSM Backend API
  # ============================================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: itsm_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      DATABASE_URL: postgresql://${DB_USER:-itsm_user}:${DB_PASSWORD:-itsm_password}@postgres:5432/${DB_NAME:-itsm_db}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_password}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_RESET_SECRET: ${JWT_RESET_SECRET}
      JWT_VERIFY_SECRET: ${JWT_VERIFY_SECRET}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID}
      FIREBASE_CLIENT_EMAIL: ${FIREBASE_CLIENT_EMAIL}
      FIREBASE_PRIVATE_KEY: ${FIREBASE_PRIVATE_KEY}
      APP_NAME: ${APP_NAME:-ITSM Platform}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-*}
      UPLOAD_DIR: /app/uploads
      MAX_FILE_SIZE: ${MAX_FILE_SIZE:-10485760}
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "${PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    networks:
      - itsm_network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.itsm-api.rule=Host(`${DOMAIN:-localhost}`)"

  # ============================================================
  # Database Migration Runner (one-shot)
  # ============================================================
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: deps
    container_name: itsm_migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${DB_USER:-itsm_user}:${DB_PASSWORD:-itsm_password}@postgres:5432/${DB_NAME:-itsm_db}?schema=public
    command: >
      sh -c "npx prisma migrate deploy"
    networks:
      - itsm_network
    restart: "no"

  # ============================================================
  # Redis Commander (dev only — remove in prod)
  # ============================================================
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: itsm_redis_ui
    restart: unless-stopped
    environment:
      REDIS_HOSTS: local:redis:6379:0:${REDIS_PASSWORD:-redis_password}
    ports:
      - "8081:8081"
    depends_on:
      - redis
    networks:
      - itsm_network
    profiles:
      - dev

  # ============================================================
  # pgAdmin (dev only — remove in prod)
  # ============================================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: itsm_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@itsm.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123}
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - itsm_network
    profiles:
      - dev

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  uploads_data:
    driver: local

networks:
  itsm_network:
    driver: bridge
