services:
  postgres-test:
    image: postgres:16-alpine

    environment:
      POSTGRES_USER: itsm_user
      POSTGRES_PASSWORD: itsm_password
      POSTGRES_DB: itsm_test

    ports:
      - "127.0.0.1:55432:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U itsm_user -d itsm_test"]
      interval: 5s
      timeout: 5s
      retries: 10

    volumes:
      - itsm_test_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro

volumes:
  itsm_test_postgres_data:
