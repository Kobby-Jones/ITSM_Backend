version: '3.9'

# Development overrides — run with:
# docker compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  api:
    build:
      target: deps
    command: ["npx", "nodemon", "--watch", "src", "--ext", "js", "src/server.js"]
    environment:
      NODE_ENV: development
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "3000:3000"
      - "9229:9229"   # Node inspector
